<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOHAIB NETWORK | V2Ray Config Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            background-image: radial-gradient(#0f0 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Courier New', monospace;
            color: #0f0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .banner {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #0f0;
            padding-bottom: 20px;
        }
        .banner h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-shadow: 0 0 5px #0f0;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 30px;
            background: #111;
            padding: 15px;
            border: 1px solid #2a2;
            border-radius: 8px;
        }
        .btn {
            background: #020;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 20px;
            cursor: pointer;
        }
        .btn:hover { background: #0f0; color: black; }
        select, input {
            background: #111;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 12px;
            font-family: monospace;
        }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .card {
            background: #0a0f0a;
            border: 1px solid #2a4;
            border-radius: 12px;
            padding: 16px;
            transition: 0.2s;
        }
        .card:hover { border-color: #0f0; box-shadow: 0 0 10px #0f0; }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #2a4;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .protocol { background: #020; padding: 4px 12px; border-radius: 20px; }
        .status { color: #0f0; font-weight: bold; }
        .server {
            background: #030;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            word-break: break-all;
            margin: 10px 0;
        }
        .country { display: inline-block; background: #111; padding: 4px 12px; border-radius: 20px; margin-top: 8px; }
        .copy-btn {
            width: 100%;
            margin-top: 15px;
            background: #020;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px;
            cursor: pointer;
        }
        .copy-btn:hover { background: #0f0; color: black; }
        .loading { text-align: center; padding: 50px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        footer { text-align: center; margin-top: 40px; font-size: 0.7rem; color: #4a4; }
    </style>
</head>
<body>
<div class="container">
    <div class="banner">
        <h1>┌─┐┬ ┬┌─┐┌┐┌┌─┐  ┬┌─┐  ZOHAIB_NETWORK</h1>
        <p>>_ v2ray config hub | only working websocket nodes</p>
        <p>>_ last updated: <span id="timestamp">-</span></p>
    </div>
    <div class="controls">
        <button class="btn" id="refreshBtn">⟳ REFRESH</button>
        <select id="countryFilter"><option value="all">🌍 ALL COUNTRIES</option></select>
        <input type="text" id="searchBox" placeholder="🔍 SEARCH IP/DOMAIN">
    </div>
    <div id="content" class="loading">>_ loading exploit modules...</div>
    <footer># only alive configs shown | auto-refresh every 60s</footer>
</div>
<script>
    let allConfigs = [];
    async function fetchConfigs() {
        document.getElementById('content').innerHTML = '<div class="loading">>_ scanning darknets...<br>testing websocket endpoints...</div>';
        try {
            const res = await fetch('/api/collector');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (data.status === 'success' && data.configs.length) {
                allConfigs = data.configs;
                renderCards(allConfigs);
                populateCountries(allConfigs);
                document.getElementById('timestamp').innerText = new Date().toLocaleString();
            } else {
                document.getElementById('content').innerHTML = '<div class="loading">⚠️ no working configs found. try refresh.</div>';
            }
        } catch (err) {
            document.getElementById('content').innerHTML = `<div class="loading">⚠️ network error: ${err.message}</div>`;
        }
    }
    function renderCards(configs) {
        if (!configs.length) {
            document.getElementById('content').innerHTML = '<div class="loading">😞 no configs.</div>';
            return;
        }
        let html = '<div class="config-grid">';
        for (let cfg of configs) {
            const proto = cfg.config.startsWith('vless') ? 'VLESS' : 'TROJAN';
            const serverMatch = cfg.config.match(/@([^:]+):(\d+)/);
            const server = serverMatch ? serverMatch[1] : '?';
            const port = serverMatch ? serverMatch[2] : '?';
            const flag = getFlag(cfg.country);
            html += `
                <div class="card">
                    <div class="card-header">
                        <span class="protocol">${proto}</span>
                        <span class="status">✅ ${cfg.ping}ms</span>
                    </div>
                    <div class="server">🌐 ${server}:${port}</div>
                    <div class="country">${flag} ${cfg.country}</div>
                    <button class="copy-btn" data-url="${cfg.config.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}">📋 COPY</button>
                </div>
            `;
        }
        html += '</div>';
        document.getElementById('content').innerHTML = html;
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                let url = btn.getAttribute('data-url');
                navigator.clipboard.writeText(url);
                btn.innerText = '✓ COPIED!';
                setTimeout(() => btn.innerText = '📋 COPY', 1500);
            });
        });
    }
    function getFlag(country) {
        const map = { 'Singapore':'🇸🇬','Pakistan':'🇵🇰','Germany':'🇩🇪','United States':'🇺🇸','Canada':'🇨🇦','United Kingdom':'🇬🇧','France':'🇫🇷','Netherlands':'🇳🇱','Japan':'🇯🇵','India':'🇮🇳','Brazil':'🇧🇷','Russia':'🇷🇺','Australia':'🇦🇺' };
        return map[country] || '🏳️';
    }
    function populateCountries(configs) {
        const countries = [...new Set(configs.map(c => c.country))];
        const select = document.getElementById('countryFilter');
        select.innerHTML = '<option value="all">🌍 ALL COUNTRIES</option>';
        countries.sort().forEach(c => select.innerHTML += `<option value="${c}">${getFlag(c)} ${c}</option>`);
    }
    function filterConfigs() {
        const country = document.getElementById('countryFilter').value;
        const search = document.getElementById('searchBox').value.toLowerCase();
        let filtered = allConfigs;
        if (country !== 'all') filtered = filtered.filter(c => c.country === country);
        if (search) filtered = filtered.filter(c => c.config.toLowerCase().includes(search));
        renderCards(filtered);
    }
    document.getElementById('refreshBtn').addEventListener('click', fetchConfigs);
    document.getElementById('countryFilter').addEventListener('change', filterConfigs);
    document.getElementById('searchBox').addEventListener('input', filterConfigs);
    fetchConfigs();
    setInterval(fetchConfigs, 60000);
</script>
</body>
</html>
